name: Deploy PlayCUT a GitHub Pages

on:
  push:
    branches:
      - main
      - claude/capcut-style-editing-app-hwkly2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir el sitio (raíz del repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
